apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  annotations:
    texas.nais.io/enabled: "true"
  name: oebs-po-ap-api-dependabot
  namespace: team-oebs
  labels:
    team: team-oebs
spec:
  image: {{ image }}
  port: 8080

  ttl: 7m

  envFrom:
    - secret: dependabot-oebs-t1

  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: /internal/isalive
    initialDelay: 60
    timeout: 11
  readiness:
    path: /internal/isready
    initialDelay: 60
    timeout: 10
  resources:
    requests:
      cpu: 40m
      memory: 512Mi
    limits:
      memory: 1024Mi
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no

  accessPolicy:
    inbound:
      rules: [ ]
    outbound:
      external: [ ]

  prometheus:
    enabled: true
    path: /actuator/prometheus
