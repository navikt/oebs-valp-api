name: Dependabot auto-merge
on:
  schedule:
    - cron: '0 7-13 * * 1-5'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@2c57e8fdb262ad558901e1242c89b19346e3a7a1
        with:
          token: ${{ steps.app-token.outputs.token }}
          blackout-periods: "Sat,Sun,May 1,May 17,Dec 24-Jan 3"
          semver-filter: 'major,patch,minor,unknown'
          auto-approve: true
          merge-method: 'squash'
