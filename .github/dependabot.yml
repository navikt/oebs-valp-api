version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
      timezone: "Europe/Oslo"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - navikt/oebs-java-dev
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
      timezone: "Europe/Oslo"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 50
    reviewers:
      - navikt/oebs-java-dev
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
      timezone: "Europe/Oslo"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - navikt/oebs-java-dev